<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dentiste Pro — Générateur de contenu Instagram</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #242424;
      --border: #2e2e2e;
      --text: #f0f0f0;
      --text-secondary: #888;
      --accent: #7c6af7;
      --accent-light: #a99ef9;
      --green: #4ade80;
      --radius: 12px;
      --font: 'Inter', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
    }

    .logo {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent-light);
      margin-bottom: 2.5rem;
      opacity: 0.8;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      width: 100%;
      max-width: 560px;
    }

    .card-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .card-sub {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 1.75rem;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; }
    }

    .field { display: flex; flex-direction: column; gap: 6px; }

    label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    select, input[type="text"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      padding: 9px 12px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
      font-family: var(--font);
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--accent);
    }

    select option { background: #1a1a1a; }

    .btn {
      width: 100%;
      padding: 11px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.1s;
      font-family: var(--font);
    }

    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .result-card {
      margin-top: 1.5rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: none;
    }

    .result-card.visible { display: block; }

    .ig-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }

    .ig-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c6af7, #4ade80);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .ig-info { flex: 1; }
    .ig-name { font-size: 13px; font-weight: 600; }
    .ig-location { font-size: 11px; color: var(--text-secondary); margin-top: 1px; }

    .ig-badge {
      font-size: 10px;
      background: rgba(124,106,247,0.15);
      color: var(--accent-light);
      border-radius: 20px;
      padding: 3px 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .ig-body {
      padding: 16px;
      min-height: 100px;
    }

    .ig-body p {
      font-size: 14px;
      line-height: 1.75;
      white-space: pre-wrap;
      color: var(--text);
    }

    .ig-body p.loading {
      color: var(--text-secondary);
      font-style: italic;
      font-size: 13px;
    }

    .ig-body p.error {
      color: #f87171;
      font-size: 13px;
      font-style: italic;
    }

    .loading-dots::after {
      content: '';
      animation: dots 1.2s steps(3, end) infinite;
    }

    @keyframes dots {
      0%   { content: ''; }
      33%  { content: '.'; }
      66%  { content: '..'; }
      100% { content: '...'; }
    }

    .tags-row {
      padding: 10px 16px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      border-top: 1px solid var(--border);
    }

    .tag {
      font-size: 11px;
      background: rgba(255,255,255,0.06);
      color: var(--text-secondary);
      border-radius: 20px;
      padding: 3px 10px;
    }

    .actions-row {
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--border);
    }

    .action-btn {
      font-size: 12px;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-family: var(--font);
      transition: background 0.15s;
    }

    .action-btn:hover { background: var(--surface2); }
    .action-btn.copied { color: var(--green); border-color: var(--green); }

    .footer {
      margin-top: 2rem;
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <div class="logo">KHSystem · Meta Ads</div>

  <div class="card">
    <h1 class="card-title">Générateur de posts Instagram</h1>
    <p class="card-sub">Sélectionnez vos paramètres et obtenez un post prêt à publier en quelques secondes.</p>

    <div class="grid">
      <div class="field">
        <label>Sujet</label>
        <select id="sujet">
          <option value="Turn idea into reality">Du scanner au sourire</option>
          <option value="Real time">Événement (Aïd, canicule…)</option>
          <option value="Recent Past">Cas patient récent</option>
          <option value="Cap trends">Tendances (IA, facettes…)</option>
          <option value="Present">Vie du cabinet</option>
          <option value="Manufactured">Débat / idées reçues</option>
          <option value="Far past">Histoire du cabinet</option>
        </select>
      </div>
      <div class="field">
        <label>Accroche</label>
        <select id="trigger">
          <option value="Conflict">Conflit (démystifier)</option>
          <option value="Relevancy">Pertinence (douleur)</option>
          <option value="Unusual">Insolite (fait surprenant)</option>
          <option value="Recency">Nouveauté disponible</option>
          <option value="Proximity">Proximité locale</option>
          <option value="Celebrity">Référence connue</option>
        </select>
      </div>
      <div class="field">
        <label>Format</label>
        <select id="format">
          <option value="Steps">Étapes (1, 2, 3)</option>
          <option value="Story">Histoire émotionnelle</option>
          <option value="List">Liste de points clés</option>
        </select>
      </div>
      <div class="field">
        <label>Ville</label>
        <input type="text" id="ville" placeholder="ex: Alger, Oran…" />
      </div>
    </div>

    <button class="btn" id="genBtn" onclick="generate()">✦ Générer le post</button>

    <div class="result-card" id="resultCard">
      <div class="ig-header">
        <div class="ig-avatar">Dr</div>
        <div class="ig-info">
          <div class="ig-name">Cabinet Dentaire</div>
          <div class="ig-location" id="igLocation">Algérie</div>
        </div>
        <span class="ig-badge">Instagram</span>
      </div>
      <div class="ig-body">
        <p id="postContent" class="loading loading-dots">Rédaction en cours</p>
      </div>
      <div class="tags-row" id="tagsRow"></div>
      <div class="actions-row">
        <button class="action-btn" id="copyBtn" onclick="copyPost()">Copier</button>
        <button class="action-btn" onclick="generate()">Regénérer</button>
      </div>
    </div>
  </div>

  <div class="footer">Propulsé par KHSystem · Meta Ads</div>

  <script>
    const WEBHOOK = "https://ld-khalil.hawiyat.org/webhook/dentiste-post-generator";

    async function generate() {
      const sujet = document.getElementById('sujet').value;
      const trigger = document.getElementById('trigger').value;
      const format = document.getElementById('format').value;
      const ville = document.getElementById('ville').value.trim() || 'Algérie';

      const btn = document.getElementById('genBtn');
      const card = document.getElementById('resultCard');
      const content = document.getElementById('postContent');
      const tags = document.getElementById('tagsRow');

      btn.disabled = true;
      btn.textContent = 'Génération…';
      card.classList.add('visible');
      content.className = 'loading loading-dots';
      content.textContent = 'Rédaction en cours';
      tags.innerHTML = '';
      document.getElementById('igLocation').textContent = ville;

      try {
        const res = await fetch(WEBHOOK, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sujet, trigger, format, ville })
        });

        if (!res.ok) {
          const err = await res.text();
          content.className = 'error';
          content.textContent = 'Erreur ' + res.status + ' : ' + err.slice(0, 150);
        } else {
          const data = await res.json();
          const text = data.post || 'Réponse vide.';
          content.className = '';
          content.textContent = text;
          tags.innerHTML = [sujet, trigger, format].map(t =>
            `<span class="tag">${t}</span>`
          ).join('');
        }
      } catch (err) {
        content.className = 'error';
        content.textContent = 'Erreur réseau : ' + err.message;
      }

      btn.disabled = false;
      btn.textContent = '✦ Générer le post';
    }

    function copyPost() {
      const text = document.getElementById('postContent').textContent;
      navigator.clipboard.writeText(text).catch(() => {});
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copié ✓';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'Copier';
        btn.classList.remove('copied');
      }, 2000);
    }
  </script>
</body>
</html>
